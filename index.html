<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的资源站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f5f5f5; padding: 20px; }
  h1 { text-align: center; margin: 30px 0; color: #333; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
  .card { background: #fff; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform .2s, box-shadow .2s; text-decoration: none; color: inherit; display: block; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,.12); }
  .card img { width: 100%; height: 180px; object-fit: cover; display: block; }
  .card h3 { padding: 14px 16px; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>

<h1>📦 资源分享</h1>
<div class="grid" id="grid"></div>

<script>
fetch('data.json').then(r=>r.json()).then(list=>{
  const g = document.getElementById('grid');
  list.forEach(item=>{
    g.innerHTML += `
      <a class="card" href="detail.html?id=${item.id}">
        <img src="${item.preview_img}" alt="">
        <h3>${item.title}</h3>
      </a>`;
  });
});
</script>
</body>
</html>
