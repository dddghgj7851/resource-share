<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资源分享平台</title>
  <style>
    /* ==================== 基础样式 ==================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f5f5f5;
      color: #333;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #444;
      margin-bottom: 30px;
    }

    /* ==================== 主页列表样式 ==================== */
    .resource-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      overflow: hidden;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    /* ✅ 主页封面图：半身图（图2） */
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      object-position: top; /* 显示图片顶部（半身） */
      display: block;
    }

    .card .title {
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
    }

    /* ✅ Footer Note 样式 */
    .footer-note {
      text-align: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #eee;
      font-size: 14px;
      color: #888;
    }

    .footer-note a {
      color: #ff6b35;
      text-decoration: none;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>📦 精品资源分享</h1>
  
  <div class="resource-list" id="resourceList">
    <!-- 资源卡片将由JavaScript动态生成 -->
  </div>

  <div class="footer-note">
    本站为个人整理分享，通过 <a href="https://afdian.net/" target="_blank">爱发电</a> 接受赞助支持，非商业售卖。
  </div>
</div>

<script>
  // ==========================================
  // ✅ 页面初始化
  // ==========================================
  document.addEventListener('DOMContentLoaded', () => {
    renderHomePage();
  });

  // ==========================================
  // ✅ 主页相关函数
  // ==========================================
  async function renderHomePage() {
    try {
      // 从data.json加载数据
      const response = await fetch('data.json');
      const resources = await response.json();
      
      const listEl = document.getElementById('resourceList');
      listEl.innerHTML = '';
      
      resources.forEach(resource => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => {
          // 跳转到详情页，并传递ID参数
          window.location.href = `details.html?id=${resource.id}`;
        };
        
        card.innerHTML = `
          <img src="${resource.preview_img}" alt="${resource.title}">
          <div class="title">${resource.title}</div>
        `;
        
        listEl.appendChild(card);
      });
    } catch (error) {
      console.error('加载数据失败:', error);
      document.getElementById('resourceList').innerHTML = '<p style="text-align:center;color:#999;">数据加载失败，请刷新重试</p>';
    }
  }
</script>

</body>
</html>
