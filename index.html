<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>资源分享平台</title>
  <!-- 引入CSS样式文件 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <!-- ==================== 主页：资源列表 ==================== -->
  <div id="homePage">
    <h1>📦 精品资源分享</h1>
    
    <div class="resource-list" id="resourceList">
      <!-- 资源卡片将由JavaScript动态生成 -->
    </div>
  </div>

  <!-- ==================== 详情页：单个资源 ==================== -->
  <div id="detailPage" style="display:none;">
    <div class="container">
      <!-- 资源标题和描述 -->
      <div class="detail-header">
        <h2 id="detailTitle"></h2>
        <p id="detailDesc"></p>
      </div>

      <!-- ✅ 详情页图片区域：一行三列，每张占1/3宽度 -->
      <div class="image-gallery" id="detailGallery">
        <!-- 3张详情图将由JavaScript动态生成 -->
      </div>

      <!-- 解锁区域 -->
      <div class="unlock-box">
        <div class="input-group">
          <input type="text" id="tokenInput" placeholder="请输入订单号（纯数字）">
          <button class="btn" onclick="doUnlock()">🔓 解锁网盘地址</button>
          <button class="btn btn-secondary" onclick="pasteToken()">粘贴</button>
        </div>
        <p style="font-size:14px; color:#999; margin-top:15px;">
          💡 赞助后请勿刷新页面，直接输入订单号即可解锁
        </p>
        
        <!-- 结果显示区域 -->
        <div class="result-box" id="resultBox">
          <strong>🎁 网盘地址：</strong>
          <a href="#" id="panLink" target="_blank"></a>
          <strong>🔑 提取码：</strong>
          <span id="panCode"></span>
        </div>
      </div>

      <!-- ✅ Footer Note -->
      <div class="footer-note">
        本站为个人整理分享，通过 <a href="https://afdian.net/" target="_blank">爱发电</a> 接受赞助支持，非商业售卖。
      </div>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // ✅ 配置区域
  // ==========================================
  const API_URL = "https://res.top147.dpdns.org"; // 你的Worker接口地址
  
  // ==========================================
  // ✅ 页面初始化
  // ==========================================
  document.addEventListener('DOMContentLoaded', () => {
    // 检查URL参数，判断是否直接进入详情页
    const params = new URLSearchParams(window.location.search);
    const resourceId = params.get('id');
    
    if (resourceId) {
      // 直接进入详情页
      showDetail(resourceId);
    } else {
      // 显示主页列表
      renderHomePage();
    }
  });

  // ==========================================
  // ✅ 主页相关函数
  // ==========================================
  async function renderHomePage() {
    try {
      // 从data.json加载数据
      const response = await fetch('data.json');
      const resources = await response.json();
      
      const listEl = document.getElementById('resourceList');
      listEl.innerHTML = '';
      
      resources.forEach(resource => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => {
          // 跳转到详情页，并传递ID参数
          window.location.href = `index.html?id=${resource.id}`;
        };
        
        card.innerHTML = `
          <img src="${resource.preview_img}" alt="${resource.title}">
          <div class="title">${resource.title}</div>
        `;
        
        listEl.appendChild(card);
      });
    } catch (error) {
      console.error('加载数据失败:', error);
      document.getElementById('resourceList').innerHTML = '<p style="text-align:center;color:#999;">数据加载失败，请刷新重试</p>';
    }
  }

  // ==========================================
  // ✅ 详情页相关函数
  // ==========================================
  async function showDetail(id) {
    try {
      // 切换页面显示
      document.getElementById('homePage').style.display = 'none';
      document.getElementById('detailPage').style.display = 'block';
      
      // 从data.json加载数据
      const response = await fetch('data.json');
      const resources = await response.json();
      
      // 查找资源
      const resource = resources.find(r => r.id === id);
      if (!resource) {
        alert('资源不存在！');
        window.location.href = 'index.html';
        return;
      }
      
      // 设置标题和描述
      document.getElementById('detailTitle').innerText = resource.title;
      document.getElementById('detailDesc').innerText = resource.detail;
      
      // ✅ 渲染3张详情图（一行三列，每张占1/3宽度）
      const galleryEl = document.getElementById('detailGallery');
      galleryEl.innerHTML = '';
      
      resource.images.forEach(imgUrl => {
        const div = document.createElement('div');
        div.className = 'image-item';
        div.innerHTML = `<img src="${imgUrl}" alt="详情图" loading="lazy">`;
        galleryEl.appendChild(div);
      });
      
      // 重置解锁区域
      document.getElementById('resultBox').style.display = 'none';
      document.getElementById('tokenInput').value = '';
    } catch (error) {
      console.error('加载详情失败:', error);
      alert('加载详情失败，请返回重试');
    }
  }

  // ==========================================
  // ✅ 解锁相关函数
  // ==========================================
  async function pasteToken() {
    try {
      const text = await navigator.clipboard.readText();
      const clean = text.trim().replace(/[^0-9]/g, '');
      document.getElementById('tokenInput').value = clean;
    } catch (err) {
      alert('无法读取剪贴板，请手动输入订单号');
      document.getElementById('tokenInput').focus();
    }
  }

  async function doUnlock() {
    const token = document.getElementById('tokenInput').value.trim();
    if (!token) {
      alert('请输入订单号！');
      return;
    }
    
    const btn = event.target;
    const originalText = btn.innerText;
    btn.innerText = '查询中...';
    btn.disabled = true;
    
    try {
      const response = await fetch(`${API_URL}/unlock`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token })
      });
      
      const result = await response.json();
      
      if (result.ok) {
        // 显示解锁结果
        document.getElementById('panLink').innerText = result.panUrl;
        document.getElementById('panLink').href = result.panUrl;
        document.getElementById('panCode').innerText = result.panCode;
        document.getElementById('resultBox').style.display = 'block';
        
        // 滚动到结果区域
        document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth' });
      } else {
        alert(`❌ 解锁失败：${result.msg || '订单号无效'}`);
      }
    } catch (error) {
      console.error('解锁请求失败:', error);
      alert('⚠️ 网络错误，请检查网络连接后重试');
    } finally {
      btn.innerText = originalText;
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
