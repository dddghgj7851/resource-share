<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资源详情</title>
<style>
  :root { --primary: #ff6b35; --bg: #f5f5f5; --card: #fff; --text: #333; --border: #eee; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 20px; max-width: 900px; margin: 0 auto; }
  
  /* 头部 */
  .header { display: flex; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
  .back-btn { color: #666; text-decoration: none; margin-right: 15px; font-size: 14px; }
  .back-btn:hover { color: var(--primary); }
  .page-title { font-size: 18px; font-weight: 600; color: #222; }

  /* ✅ 1. 预览图（封面）：使用 preview_img，显示最上方 */
  .preview { width: 100%; height: 380px; border-radius: 12px; overflow: hidden; margin-bottom: 25px; background: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
  .preview img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }

  /* 文本 */
  .title { font-size: 24px; font-weight: bold; margin-bottom: 12px; color: #222; }
  .desc { font-size: 15px; color: #555; background: var(--card); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 25px; line-height: 1.8; white-space: pre-wrap; }

  /* ✅ 2. 详情图（images）：3张，2+1布局，全图展示 */
  .gallery { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
  .row { display: flex; gap: 15px; justify-content: center; }
  .item { background: var(--card); border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
  /* 第一行2张 */
  .row-2 .item { flex: 1; max-width: calc(50% - 7.5px); aspect-ratio: 4/3; }
  /* 第二行1张 */
  .row-1 .item { width: 100%; max-width: 450px; aspect-ratio: 16/9; }
  .item img { width: 100%; height: 100%; object-fit: contain; background: #f8f8f8; }

  /* 按钮 */
  .btn { display: inline-block; background: linear-gradient(135deg, var(--primary), #ff8a5c); color: #fff; padding: 12px 35px; border-radius: 8px; text-decoration: none; font-size: 16px; font-weight: 600; cursor: pointer; border: none; transition: all .2s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,107,53,0.3); }
  .btn-secondary { background: #6c757d; }
  .btn-secondary:hover { background: #5a6268; }

  /* 解锁区 */
  #unlockBox { margin-top: 20px; background: #fff; padding: 20px; border-radius: 10px; border: 1px solid #ddd; display: none; }
  #unlockBox input { width: 280px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-right: 10px; }
  #refreshTip { margin-top: 15px; padding: 10px; background: #fff3cd; color: #856404; border-radius: 6px; display: none; font-size: 13px; }

  /* 结果 */
  .result { margin-top: 20px; background: #f0f9f0; border: 1px solid #c8e6c8; padding: 15px; border-radius: 8px; display: none; font-size: 14px; }
  .result a { color: #2e7d32; font-weight: 600; word-break: break-all; }

  .tip { margin-top: 20px; font-size: 13px; color: #888; text-align: center; }
  .footer-note { margin-top: 40px; font-size: 13px; color: #aaa; text-align: center; }
  .footer-note a { color: var(--primary); text-decoration: none; }
</style>
</head>
<body>

<div class="header">
  <a class="back-btn" href="index.html">← 返回</a>
  <span class="page-title">资源详情</span>
</div>

<!-- ✅ 1. 预览图（封面）：来自 preview_img -->
<div class="preview">
  <img id="previewImg" src="" alt="预览图">
</div>

<!-- ✅ 标题与描述 -->
<div class="title" id="title"></div>
<div class="desc" id="desc"></div>

<!-- ✅ 2. 详情图（images）：3张，2+1布局 -->
<div class="gallery">
  <!-- 第一行：2张 -->
  <div class="row row-2">
    <div class="item"><img id="detailImg1" src="" alt="详情图1"></div>
    <div class="item"><img id="detailImg2" src="" alt="详情图2"></div>
  </div>
  <!-- 第二行：1张（居中） -->
  <div class="row row-1">
    <div class="item"><img id="detailImg3" src="" alt="详情图3"></div>
  </div>
</div>

<!-- ✅ 赞助按钮 -->
<div style="text-align:center; margin-bottom:30px;">
  <button class="btn" id="payBtn">🔓 赞助获取网盘地址</button>
</div>

<!-- 提示 -->
<div id="refreshTip">
  ✅ 支付后请勿刷新，直接在本页输入订单号解锁
</div>

<!-- ✅ 解锁区 -->
<div id="unlockBox">
  输入订单号：
  <input id="tokenInput" type="text" placeholder="纯数字订单号">
  <button class="btn" onclick="doUnlock()">解锁</button>
  <button class="btn btn-secondary" onclick="pasteToken()">粘贴</button>
</div>

<!-- 结果 -->
<div class="result" id="result">
  🎉 网盘地址：<a href="#" id="link" target="_blank"></a>
  🔑 提取码：<strong id="code"></strong>
</div>

<div class="tip">如无法识别，请手动输入订单号</div>
<div class="footer-note">本站通过 <a href="https://afdian.net" target="_blank">爱发电</a> 接受赞助</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const API = "https://res.top147.dpdns.org"; // 你的 Worker 地址
  let currentItem = null;

  // 加载数据
  fetch('data.json')
    .then(r => r.json())
    .then(list => {
      currentItem = list.find(x => x.id === id);
      if (!currentItem) {
        document.body.innerHTML = '<p style="padding:60px;text-align:center;color:#999">资源不存在</p>';
        return;
      }

      // ✅ 1. 预览图：使用 preview_img
      document.getElementById('previewImg').src = currentItem.preview_img || 'https://via.placeholder.com/800x400?text=Preview';
      
      // ✅ 2. 标题描述
      document.getElementById('title').textContent = currentItem.title;
      document.getElementById('desc').textContent = currentItem.detail;
      
      // ✅ 3. 详情图：使用 images 数组的前3张
      const imgs = currentItem.images || [];
      if (imgs[0]) document.getElementById('detailImg1').src = imgs[0];
      if (imgs[1]) document.getElementById('detailImg2').src = imgs[1];
      if (imgs[2]) document.getElementById('detailImg3').src = imgs[2];
    })
    .catch(err => {
      console.error("加载失败:", err);
      document.body.innerHTML = '<p style="padding:60px;text-align:center;color:#999">数据加载失败</p>';
    });

  // ✅ 点击赞助
  document.getElementById('payBtn').onclick = () => {
    if (!currentItem) return;
    window.open(currentItem.afdLink, '_blank');
    document.getElementById('refreshTip').style.display = 'block';
    document.getElementById('unlockBox').style.display = 'block';
  };

  // ✅ 粘贴按钮
  async function pasteToken() {
    try {
      const text = await navigator.clipboard.readText();
      let clean = text.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (clean.startsWith('AFD')) clean = clean.substring(3);
      document.getElementById('tokenInput').value = clean;
    } catch (err) {
      alert('粘贴失败，请手动输入');
      document.getElementById('tokenInput').focus();
    }
  }

  // ✅ 解锁逻辑
  async function doUnlock() {
    const token = document.getElementById('tokenInput').value.trim().toUpperCase();
    if (!token) {
      alert('请输入订单号');
      return;
    }

    try {
      const res = await fetch(`${API}/unlock`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token })
      });

      const data = await res.json();
      
      if (data.ok) {
        document.getElementById('link').href = data.panUrl;
        document.getElementById('link').textContent = data.panUrl;
        document.getElementById('code').textContent = data.panCode;
        document.getElementById('result').style.display = 'block';
        document.getElementById('unlockBox').style.display = 'none';
      } else {
        alert('❌ ' + data.msg);
      }
    } catch (err) {
      alert('⚠️ 网络错误');
      console.error(err);
    }
  }
});
</script>

</body>
</html>
