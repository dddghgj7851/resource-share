<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资源详情</title>
<style>
body {
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
line-height: 1.6;
color: #333;
max-width: 800px;
margin: 0 auto;
padding: 20px;
background-color: #f9f9f9;
}
.container {
background: white;
padding: 30px;
border-radius: 12px;
box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}
h1 {
color: #2c3e50;
border-bottom: 2px solid #eee;
padding-bottom: 10px;
}
.images-container {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
gap: 15px;
margin: 20px 0;
}
.images-container img {
width: 100%;
height: 150px;
object-fit: cover;
border-radius: 8px;
border: 1px solid #eee;
transition: transform 0.3s;
}
.images-container img:hover {
transform: scale(1.05);
}
.price-tag {
display: inline-block;
background: #ff6b6b;
color: white;
padding: 5px 12px;
border-radius: 20px;
font-weight: bold;
margin-bottom: 15px;
}
.buy-btn {
display: inline-block;
background: #3498db;
color: white;
padding: 12px 25px;
border-radius: 25px;
text-decoration: none;
font-weight: bold;
margin-top: 10px;
transition: background 0.3s;
}
.buy-btn:hover {
background: #2980b9;
}
.unlock-box {
margin-top: 30px;
padding: 20px;
background: #f0f8ff;
border-radius: 8px;
border: 1px dashed #ccc;
}
</style>
</head>
<body>
<div class="container">
资源标题
<div id="res-desc" style="margin-bottom: 20px; color: #666;"></div>
<!-- 图片展示区域 -->
<div class="images-container" id="img-list">
    <!-- 图片将通过 JS 动态插入，最多显示 6 张 -->
</div>

<!-- 价格与购买链接 -->
<div class="price-tag">赞助 ¥1 获取</div>
<a id="buy-link" href="#" target="_blank" class="buy-btn">前往爱发电购买</a>

<!-- 解锁区域 -->
<div class="unlock-box">
    <h3>🔑 已赞助？在此解锁</h3>
    <input id="tokenInput" type="text" placeholder="粘贴爱发电订单号（纯数字）" style="padding: 10px; width: 70%; border: 1px solid #ddd; border-radius: 4px;">
    <button onclick="doUnlock()" style="padding: 10px 15px; background: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer;">解锁资源</button>
    
    <div id="result" style="display: none; margin-top: 20px; padding: 15px; background: #e8f5e9; border-radius: 8px;">
        🎉 网盘地址：<a id="link" href="#" target="_blank" style="word-break: break-all;"></a>
        🔑 提取码：<strong id="code"></strong>
    </div>
</div>
</div>
<script>
// 配置区域：在这里填写你的资源 ID（对应 KV 里的 res:xxx）
// 假设你当前页面的 URL 是 detail.html?id=001
const urlParams = new URLSearchParams(window.location.search);
const resId = urlParams.get('id') || '001'; // 默认为 001
// API 接口地址（你的 Worker 地址）
const API = "https://res.top147.dpdns.org"; 

// 页面加载时渲染详情
document.addEventListener('DOMContentLoaded', () => renderDetailPage(resId));

async function renderDetailPage(id) {
    try {
        // 1. 获取资源详情
        const res = await fetch(`${API}/detail?id=${id}`);
        const data = await res.json();

        if (data.ok) {
            // 填充文本信息
            document.getElementById('res-title').innerText = data.name;
            document.getElementById('res-desc').innerText = data.description;
            document.getElementById('buy-link').href = data.buyLink;

            // 2. 【核心修改】处理图片：最多显示 6 张
            const imgContainer = document.getElementById('img-list');
            imgContainer.innerHTML = ''; // 清空旧图

            if (data.images && data.images.length > 0) {
                // 使用 slice(0, 6) 截取数组的前 6 个元素
                const displayImages = data.images.slice(0, 6);
                
                displayImages.forEach(src => {
                    const imgEl = document.createElement('img');
                    imgEl.src = src;
                    imgEl.alt = data.name;
                    imgContainer.appendChild(imgEl);
                });
            } else {
                imgContainer.innerHTML = '暂无预览图';
            }
        } else {
            document.body.innerHTML = `<h1>资源未找到</h1>${data.msg}`;
        }
    } catch (e) {
        console.error(e);
        alert("加载详情失败，请刷新重试");
    }
}

// 解锁逻辑（保持不变）
async function doUnlock() {
    const token = document.getElementById('tokenInput').value.trim();
    if (!token) return alert("请输入订单号");

    try {
        const res = await fetch(`${API}/unlock`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token })
        });
        const data = await res.json();

        if (data.ok) {
            document.getElementById('link').href = data.panUrl;
            document.getElementById('link').textContent = data.panUrl;
            document.getElementById('code').textContent = data.panCode;
            document.getElementById('result').style.display = 'block';
        } else {
            alert("❌ " + data.msg);
        }
    } catch (e) {
        alert("⚠️ 网络错误");
    }
}
</script>
</body>
</html>
