<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资源详情</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f5; padding: 20px; }
  .box { max-width: 720px; margin: 40px auto; background: #fff; border-radius: 14px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,.05); }
  .back { color: #888; text-decoration: none; font-size: 14px; display: inline-block; margin-bottom: 18px; }
  .back:hover { color: #333; }
  .hero { width: 100%; height: 260px; object-fit: cover; border-radius: 10px; background: #eee; }
  h1 { margin: 20px 0 14px; color: #222; font-size: 24px; }
  .desc { color: #555; line-height: 1.8; margin-bottom: 28px; font-size: 15px; }
  .btn { display: inline-block; background: linear-gradient(135deg,#ff6b35,#ff8a5c); color: #fff; padding: 14px 40px; border-radius: 10px; text-decoration: none; font-size: 16px; font-weight: 600; cursor: pointer; border: none; transition: all .2s; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,107,53,.3); }
  .btn-secondary { background: #6c757d; }
  .btn-secondary:hover { background: #5a6268; }
  .result { margin-top: 24px; background: #f0f9f0; border: 1px solid #c8e6c8; padding: 20px; border-radius: 10px; display: none; }
  .result a { color: #2e7d32; font-weight: 600; word-break: break-all; }
  .tip { margin-top: 20px; font-size: 13px; color: #888; text-align: center; }
  .email { margin-top: 30px; font-size: 13px; color: #666; text-align: center; }
  .email a { color: #ff6b35; text-decoration: none; }
  #unlockBox { margin-top: 20px; display: none; }
  #unlockBox p { font-size: 14px; color: #666; margin-bottom: 10px; }
  #tokenInput { width: 200px; padding: 8px; margin-right: 8px; text-transform: uppercase; letter-spacing: 2px; }
  #refreshTip { margin-top: 15px; padding: 10px; background: #fff3cd; color: #856404; border-radius: 6px; display: none; }
  #offlineBox { margin-top: 20px; padding: 15px; background: #f8d7da; color: #721c24; border-radius: 8px; display: none; }
  #errorMsg { margin-top: 10px; padding: 10px; background: #f8d7da; color: #721c24; border-radius: 6px; display: none; }
</style>
</head>
<body>

<div class="box">
  <a class="back" href="index.html">← 返回首页</a>
  <img class="hero" id="hero" src="" alt="">
  <h1 id="title"></h1>
  <div class="desc" id="desc"></div>

  <!-- 赞助按钮 -->
  <button class="btn" id="payBtn">🔓 赞助获取网盘地址</button>

  <!-- 刷新提示 -->
  <div id="refreshTip">
    ✅ 支付完成后，请 <strong>刷新本页面</strong>，然后输入订单号后 8 位解锁。
  </div>

  <!-- 解锁区域 -->
  <div id="unlockBox">
    <p>支付成功后，请粘贴 <strong>完整订单号</strong>（系统会自动提取后 8 位）：</p>
    <input id="tokenInput" type="text" placeholder="例如：AFD20240101123456" style="width:300px;">
    <button class="btn" onclick="doUnlock()">解锁</button>
    <button class="btn btn-secondary" onclick="copyToken()">复制</button>
    <div id="errorMsg"></div>
  </div>

  <!-- 离线备用通道 -->
  <div id="offlineBox">
    <p><strong>⚠️ 在线解锁失败</strong></p>
    <p>请使用备用解锁码，或联系站长。</p>
    <input id="backupInput" type="text" placeholder="备用解锁码" style="width:200px;padding:8px;margin-right:8px;">
    <button class="btn" onclick="doBackupUnlock()">备用解锁</button>
  </div>

  <!-- 结果 -->
  <div class="result" id="result">
    <p>🎉 网盘地址：<a href="#" id="link" target="_blank"></a></p>
    <p>🔑 提取码：<strong id="code"></strong></p>
  </div>

  <div class="tip">
    如无法自动识别，请手动输入订单号后 8 位
  </div>

  <div class="email">
    问题反馈：<a href="mailto:3357134774@qq.com">3357134774@qq.com</a>
  </div>
</div>

<div class="email" style="margin-top:40px;font-size:13px;color:#aaa;text-align:center;">
  本站为个人整理分享，通过
  <a href="https://afdian.net/@你的ID" target="_blank" style="color:#ff6b35;">爱发电</a>
  接受赞助支持，非商业售卖。
</div>

<script>
const params = new URLSearchParams(location.search);
const id = params.get('id');

// ✅ 配置区
const API = "https://resource-api.plmplm999.workers.dev";
const AFD_HOME = "https://afdian.com/item/e64d18d2658811f192f252540025c377";
const BACKUP_CODES = { "001": "BACKUP001" };

let currentItem = null;

// 加载资源
fetch('data.json')
  .then(r => r.json())
  .then(list => {
    currentItem = list.find(x => x.id === id);
    if (!currentItem) {
      document.body.innerHTML = '<p style="padding:60px;text-align:center;color:#999">未找到该资源</p>';
      return;
    }
    hero.src = currentItem.preview_img;
    title.textContent = currentItem.title;
    desc.innerHTML = currentItem.detail.replace(/\n/g, '<br>');
    payBtn.textContent = `🔓 赞助 ¥${currentItem.price} 获取网盘地址`;
  });

// 点击赞助
payBtn.onclick = () => {
  if (!currentItem) return;
  window.open(AFD_HOME, '_blank');
  refreshTip.style.display = 'block';
  unlockBox.style.display = 'block';
};

// ✅ 自动提取订单号后 8 位（核心修复）
tokenInput.addEventListener('input', e => {
  let value = e.target.value.trim();
  
  // 移除所有非字母数字字符
  value = value.replace(/[^A-Z0-9]/gi, '');
  
  // 自动提取后 8 位
  if (value.length > 8) {
    value = value.slice(-8);
  }
  
  e.target.value = value.toUpperCase();
});

// 一键复制
function copyToken() {
  navigator.clipboard.writeText(tokenInput.value).then(() => {
    alert('已复制：' + tokenInput.value);
  });
}

// ✅ 主解锁逻辑（带明确错误提示）
async function doUnlock() {
  const token = tokenInput.value.trim();
  if (!token) { 
    showError('请输入订单号');
    return; 
  }
  if (token.length !== 8) {
    showError('订单号后 8 位必须是 8 位字符');
    return;
  }

  try {
    const res = await fetch(`${API}/unlock`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ resId: id, token })
    });

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    const data = await res.json();
    
    if (data.ok) {
      showResult(data);
    } else {
      // 明确提示订单号错误
      showError('❌ 订单号不正确，请检查支付成功页的订单号后 8 位');
      offlineBox.style.display = 'block';
    }
  } catch (err) {
    console.error('解锁失败:', err);
    showError('⚠️ 网络连接失败，请稍后再试');
    offlineBox.style.display = 'block';
  }
}

// ✅ 备用解锁
function doBackupUnlock() {
  const backupToken = backupInput.value.trim();
  if (backupToken === BACKUP_CODES[id]) {
    showResult({
      panUrl: currentItem.panUrl,
      panCode: currentItem.panCode
    });
  } else {
    alert('备用码错误，请联系站长');
  }
}

// 显示错误
function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
  result.style.display = 'none';
}

// 显示结果
function showResult(data) {
  link.href = data.panUrl;
  link.textContent = data.panUrl;
  code.textContent = data.panCode;
  result.style.display = 'block';
  unlockBox.style.display = 'none';
  offlineBox.style.display = 'none';
  errorMsg.style.display = 'none';
}

// 回车解锁
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && unlockBox.style.display === 'block') doUnlock();
});
</script>
</body>
</html>
